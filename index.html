<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="container">
      <menu>
        <ul>
          <li>
            <button type="button" class="btn btn-primary">Change Name</button>
          </li>
          <li>
            <button type="button" class="btn btn-destructive">Reset</button>
          </li>
        </ul>
      </menu>
      <p id="active-player"></p>
      <p id="message"></p>
      <div id="board"></div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
