<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="container">
      <menu>
        <ul>
          <li>
            <button type="button" class="btn btn-primary">Change Name</button>
          </li>
          <li>
            <button type="button" class="btn btn-destructive">Reset</button>
          </li>
        </ul>
      </menu>

      <div>
        <div>
          <div id="score-board">
            <p class="player-one">P1</p>
            <div id="score-container">
              <p id="player-one-score" class="score">0</p>
              <span class="dash">&dash;</span>
              <p id="player-two-score" class="score">0</p>
            </div>
            <p class="player-two">P2</p>
          </div>
          <div>
            <p id="message"></p>
            <p id="active-player"></p>
          </div>
        </div>
        <div id="board"></div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
