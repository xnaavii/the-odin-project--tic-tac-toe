<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="container">
      <menu>
        <ul>
          <li>
            <button
              type="button"
              class="btn btn-primary"
              id="change-name--btn"
              command="show-modal"
              commandfor="change-name--dialog"
            >
              Change Name
            </button>
            <dialog id="change-name--dialog">
              <p id="change-name--title">Change player name</p>
              <form id="change-name--form" method="dialog">
                <div class="input-group">
                  <label for="player-one--name">Player One</label>
                  <input
                    type="text"
                    id="player-one--name"
                    name="player-one--name"
                  />
                </div>
                <div class="input-group">
                  <label for="player-two--name">Player Two</label>
                  <input
                    type="text"
                    id="player-two--name"
                    name="player-two--name"
                  />
                </div>
                <button type="submit" class="btn btn-primary">Change</button>
                <button
                  type="submit"
                  class="btn btn-destructive"
                  command="hide"
                >
                  Cancel
                </button>
              </form>
            </dialog>
          </li>
          <li>
            <button type="button" class="btn btn-destructive">Reset</button>
          </li>
        </ul>
      </menu>

      <div id="game-container">
        <div id="information-board">
          <div id="score-board">
            <p class="player-one">P1</p>
            <div id="score-container">
              <p id="player-one-score" class="score">0</p>
              <span class="dash">&dash;</span>
              <p id="player-two-score" class="score">0</p>
            </div>
            <p class="player-two">P2</p>
          </div>

          <div id="turn-container">
            <p id="message"></p>
            <div class="separator"></div>
            <div id="active-player--container">
              <p id="active-player--name"></p>
              <p id="active-player--mark"></p>
            </div>
          </div>
        </div>
        <div id="game-board"></div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
